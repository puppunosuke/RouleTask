<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouleTask - 画像アップロード</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #0e0e10;
      color: #cfcfd6;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      line-height: 1.6;
    }
    h1 { color: #ffd866; font-size: 1.5rem; }
    .panel {
      background: #1a1a20;
      border: 1px solid #2a2a32;
      border-radius: 8px;
      padding: 1.2rem;
      margin: 1rem 0;
    }
    .status { color: #8a8a92; font-size: 0.9rem; }
    .status.ok { color: #6ee7b7; }
    .status.err { color: #f87171; }
    button {
      background: #1f1f26;
      color: #ffd866;
      border: 1px solid #3a3a44;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      cursor: pointer;
      margin: 0.3rem 0;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #26262e; }
    input[type="file"] { margin: 0.5rem 0; color: #cfcfd6; }
    #progress {
      margin-top: 1rem;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      padding: 0.5rem;
      background: #0e0e10;
      border: 1px solid #2a2a32;
      border-radius: 4px;
    }
    a { color: #6ee7ff; }
  </style>
</head>
<body>
  <h1>📤 画像アップロード（一時UI）</h1>

  <div class="panel">
    <div class="status" id="authStatus">ログイン状態を確認中...</div>
    <button id="loginBtn" style="display:none;">Googleでログイン</button>
  </div>

  <div class="panel" id="uploadPanel" style="display:none;">
    <p><b>青チャート画像（118枚）</b>を Firebase Storage にアップロード。</p>
    <p class="status">
      ファイル選択ダイアログで <code>~/Documents/Claude/青/</code> フォルダの<br>
      <b>全ファイル（Cmd+A で全選択）</b>を選んでね。
    </p>
    <input type="file" id="fileInput" multiple accept="image/jpeg,image/png">
    <br>
    <button id="uploadBtn" disabled>アップロード開始</button>
    <div id="progress"></div>
  </div>

  <p><a href="./">← トップへ戻る</a></p>

  <script type="module" src="firebase-init.js"></script>
  <script type="module">
    let currentUser = null;

    function init() {
      const authStatus = document.getElementById('authStatus');
      const loginBtn = document.getElementById('loginBtn');
      const uploadPanel = document.getElementById('uploadPanel');
      const fileInput = document.getElementById('fileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const progress = document.getElementById('progress');

      const fb = window.RouleTask.firebase;

      fb.watchAuthState((user) => {
        currentUser = user;
        if (user) {
          authStatus.textContent = `✅ ログイン中: ${user.email}`;
          authStatus.className = 'status ok';
          loginBtn.style.display = 'none';
          uploadPanel.style.display = 'block';
        } else {
          authStatus.textContent = 'まずログインしてね';
          authStatus.className = 'status';
          loginBtn.style.display = 'inline-block';
          uploadPanel.style.display = 'none';
        }
      });

      loginBtn.addEventListener('click', async () => {
        try {
          await fb.signInWithGoogle();
        } catch (err) {
          if (err.code === 'auth/popup-closed-by-user') return;
          alert('ログイン失敗: ' + err.message);
        }
      });

      fileInput.addEventListener('change', () => {
        uploadBtn.disabled = fileInput.files.length === 0;
      });

      uploadBtn.addEventListener('click', async () => {
        if (!currentUser) return;
        const files = Array.from(fileInput.files);
        uploadBtn.disabled = true;
        progress.textContent = '';

        let ok = 0, fail = 0;
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          try {
            await fb.uploadImage(currentUser.uid, f.name, f);
            ok++;
            progress.textContent += `✅ ${f.name}  (${i + 1}/${files.length})\n`;
          } catch (err) {
            fail++;
            progress.textContent += `❌ ${f.name}  (${err.message})\n`;
          }
          progress.scrollTop = progress.scrollHeight;
        }
        progress.textContent += `\n完了: ${ok} 成功 / ${fail} 失敗\n`;
        uploadBtn.disabled = false;
      });
    }

    if (window.RouleTask && window.RouleTask.firebase) {
      init();
    } else {
      window.addEventListener('RouleTask:firebase-ready', init, { once: true });
    }
  </script>
</body>
</html>
